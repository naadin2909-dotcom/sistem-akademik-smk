[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "php artisan config:clear && php artisan serve --host=0.0.0.0 --port=8000"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[watch]
ignorePatterns = ["node_modules/**", "vendor/**", "storage/**", "*.md"]
